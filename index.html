<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="FrissIdő - Modern időjárás előrejelző alkalmazás">
    <meta name="theme-color" content="#0b162c">
    
    <!-- iOS támogatás -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FrissIdő">
    <link rel="apple-touch-icon" href="logo.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <title>FrissIdő - WeatherWeb</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="logo-container">
                    <img src="logo.png" alt="FrissIdő WeatherWeb" class="app-logo">
                </div>
            </div>
        </header>

        <main class="app-main">
            <section class="search-section">
                <div class="search-container">
                    <div class="search-input-wrapper">
                        <input type="text" id="cityInput" class="city-input" placeholder="Keress egy várost..." autocomplete="off">
                        <button id="searchBtn" class="search-button">Keresés</button>
                    </div>
                </div>
            </section>

            <section id="currentWeather" class="current-weather-section">
                <div class="loading-container" id="loadingIndicator">
                    <div class="loading-spinner"></div>
                    <p id="loadingText">Helymeghatározás...</p>
                </div>
                
                <div class="error-container" id="errorIndicator" style="display: none;">
                    <p id="errorMessage" class="error-text"></p>
                    <button id="retryButton" class="retry-button">Újrapróbálás</button>
                </div>

                <div class="current-weather-card" id="currentWeatherCard" style="display: none;">
                    <div class="current-weather-header">
                        <h2 id="currentCity" class="current-city">Betöltés...</h2>
                        <p id="currentDate" class="current-date"></p>
                    </div>
                    <div class="current-weather-main">
                        <div class="temperature-section">
                            <div class="current-temp" id="currentTemp">--°C</div>
                            <div class="weather-description" id="weatherDescription">--</div>
                        </div>
                        <div class="weather-icon">
                            <div id="weatherIcon" class="weather-icon-container"></div>
                        </div>
                    </div>
                    <div class="weather-details">
                        <div class="detail-item">
                            <span class="detail-label">Hőérzet</span>
                            <span class="detail-value" id="feelsLike">--°C</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Páratartalom</span>
                            <span class="detail-value" id="humidity">--%</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Szél</span>
                            <span class="detail-value" id="windSpeed">-- km/h</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Légnyomás</span>
                            <span class="detail-value" id="pressure">-- hPa</span>
                        </div>
                    </div>
                    <div class="location-info">
                        <span id="locationMethod" class="location-method"></span>
                    </div>
                </div>
            </section>

            <section id="radarSection" class="radar-section" style="display: none;">
                <h2 class="section-title">Csapadékradar</h2>
                <div class="radar-controls">
                    <button class="radar-btn active" data-layer="precipitation">🌧️ Csapadék</button>
                    <button class="radar-btn" data-layer="clouds">☁️ Felhők</button>
                    <button class="radar-btn" data-layer="temp">🌡️ Hőmérséklet</button>
                    <button class="radar-btn" data-layer="wind">💨 Szél</button>
                </div>
                <div class="radar-container">
                    <div id="weatherMap"></div>
                </div>
            </section>

            <section id="forecastSection" class="forecast-section" style="display: none;">
                <h2 class="section-title">5 napos előrejelzés</h2>
                <div class="forecast-container" id="forecastContainer"></div>
            </section>

            <section id="hourlySection" class="hourly-section" style="display: none;">
                <h2 class="section-title">Óránkénti előrejelzés</h2>
                <div class="hourly-container" id="hourlyContainer"></div>
                <div class="chart-container">
                    <canvas id="weatherChart"></canvas>
                </div>
            </section>

            <section id="historySection" class="history-section">
                <h2 class="section-title">Korábbi keresések</h2>
                <div class="history-container" id="historyContainer">
                    <p class="empty-history">Még nincsenek korábbi keresések</p>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>FrissIdő WeatherWeb &copy; 2025</p>
        </footer>
    </div>

    <!-- Service Worker regisztráció -->
   <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => {
                    console.log('✅ Service Worker regisztrálva:', reg.scope);
                    
                    // Figyeld az új verziókat
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        console.log('🔄 Új verzió letöltése...');
                        
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('✨ Új verzió elérhető!');
                                
                                // Automatikus frissítés felajánlása
                                if (confirm('Új verzió érhető el! Frissítsük most?')) {
                                    newWorker.postMessage({ action: 'skipWaiting' });
                                }
                            }
                        });
                    });
                })
                .catch(err => console.error('❌ Service Worker hiba:', err));
            
            // Amikor az új Service Worker aktiválódik, töltsük újra az oldalt
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        });
    }
</script>
</body>
</html>
